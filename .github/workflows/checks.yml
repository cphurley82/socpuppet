name: Checks

# The checks both tiers run on Linux that no other job waits for: lint
# and the sanitizers. ci.yml and nightly.yml each call this, so
# each job here is written once.

on:
  workflow_call:

jobs:
  lint:
    # Formatting and static checks on every file, with nothing to build
    # first. ctest runs the same thing; this job says so in seconds.
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: uv run python tools/ci.py run lint

  sanitizers:
    # The C++ tests again, built so that a memory error or undefined
    # behavior stops the program instead of passing unnoticed.
    name: C++ tests under sanitizers
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build
          machine: ubuntu-26.04
          tree: dev
          compiler-cache: asan
      - run: uv run python tools/ci.py run sanitizers
