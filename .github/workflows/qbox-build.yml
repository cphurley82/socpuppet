name: QBox

# QBox's build, which both tiers wait for before they run on QBox's CPU,
# and clang-tidy over the tree that links it. ci.yml and nightly.yml each
# call this, so each job here is written once.

on:
  workflow_call:
    inputs:
      os:
        description: The machines QBox is built for, as a JSON list.
        type: string
        required: true
      tidy-os:
        description: >-
          The machines clang-tidy runs on, as a JSON list: each is one QBox
          is built for.
        type: string
        required: true

jobs:
  qbox-build:
    # QBox, Qualcomm's QEMU in SystemC, which the qbox_cpu is built on. It
    # is GPL-2.0 and built from source, which takes a quarter of an hour on
    # CI's Linux runner, so what it installs is cached, keyed on QBox's pin
    # and its patches, and this job builds it only when those change. The
    # system's libraries it links are the runner's, so the key names the
    # runner too.
    #
    # The jobs that build on QBox take it from this job, as an artifact of
    # the run, not from the cache: GitHub drops the least recently used
    # entries when a repository's caches pass 10 GB, and QBox was dropped
    # once between this job finding it and the next one restoring it.
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore QBox
        id: qbox
        uses: actions/cache/restore@v6
        with:
          path: build/qbox/install
          key: qbox-${{ matrix.os }}-${{ hashFiles('tools/build_qbox.py', 'cmake/patches/qbox-*', 'cmake/patches/libqemu-*') }}
      - if: steps.qbox.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          packages: qbox
      - if: steps.qbox.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run qbox-build
      - name: Keep QBox
        if: steps.qbox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/qbox/install
          key: ${{ steps.qbox.outputs.cache-primary-key }}
      - name: Pack QBox
        # In a tarball, which keeps the links between its libraries; an
        # artifact on its own would make copies of them.
        run: tar -czf qbox-install.tar.gz build/qbox/install
      - uses: actions/upload-artifact@v7
        with:
          name: qbox-${{ matrix.os }}
          path: qbox-install.tar.gz

  tidy:
    # clang-tidy over our own C++, and each of our headers compiled on its
    # own, over the qbox tree: the dev tree and QBox's adapter, which the
    # dev tree leaves out. Nothing else is built: clang-tidy reads the
    # sources and the compile commands that configuring writes, which are
    # GCC's on Linux and Apple clang's on a Mac, each with its own standard
    # library, so a system's leg checks our code the way that system
    # compiles it. Here it needs QBox's build, on every machine: tools/ci.py
    # falls back to the dev tree without QBox, but a failed build has
    # turned the run red already, and the dev tree's checks are a subset.
    name: clang-tidy and header check (${{ matrix.os }})
    needs: qbox-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.tidy-os) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build qbox
          machine: ${{ matrix.os }}
          tree: qbox-dev
          qbox: true
      - run: uv run python tools/ci.py run tidy
