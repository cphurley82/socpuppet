name: CI

# The quick tier, on every push to main and every pull request: lint, the
# firmware, the tests but the long ones on Linux and on an Intel Mac, and
# clang-tidy, coverage and the sanitizers on Linux. It answers in about half
# an hour. The rest is nightly.yml's: the long tests and the on-demand
# ones, twister, QBox, the wheels and the devcontainer, on every machine CI
# has. On a developer's machine, `uv run python tools/ci.py` runs that, and
# `--quick` runs this.
#
# Every job here is a thin wrapper around tools/ci.py, which holds each
# job's steps: what is left in this file is GitHub's plumbing, the checkout,
# the packages, the caches and the artifacts. A job's log opens with the
# command that runs the same job on a developer's machine.
# tests/tooling/test_ci_workflow.py keeps the two to the same jobs, and a
# job this file shares with nightly.yml to the same definition, but for the
# machines it runs on.
#
# Nothing waits for lint: a job waits only for a job whose output it reads.
#
# The one Mac here is an Intel Mac: the slowest machine CI has, so its leg
# sets the pace of the run, and the one most often broken by what only it
# has (Homebrew's headers in /usr/local). GitHub runs five Macs at a time
# for an account; nightly.yml takes the rest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request stops the run of the one before. A run on
# main always finishes, since main's caches are the ones every branch reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Formatting and static checks on every file, with nothing to build
    # first. ctest runs the same thing; this job says so in seconds.
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run python tools/ci.py run lint

  fetch-sdk:
    # The Zephyr SDK's RISC-V toolchain, for the machine it runs on, kept
    # in a cache keyed on its version, and fetched only when that changes.
    # The jobs that build with it restore it from there. Its tools are
    # prebuilt to run on any Linux, so the key names the runner's system
    # and processor and not its Ubuntu: one copy serves 24.04 and 26.04.
    name: Zephyr SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - name: Look for it in the cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/zephyr-sdk-*
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          lookup-only: true
      - uses: astral-sh/setup-uv@v7
        if: steps.cache.outputs.cache-hit != 'true'
      - if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run fetch-sdk
      - name: Keep it
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/firmware/*/zephyr-sdk-*
          key: ${{ steps.cache.outputs.cache-primary-key }}

  fetch-llvm:
    # The SDK's LLVM, which builds OpenSBI and EDK2: two gigabytes, so
    # kept apart from the SDK, and cached as it is.
    name: Zephyr SDK's LLVM
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Look for it in the cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/llvm-*
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          lookup-only: true
      - uses: astral-sh/setup-uv@v7
        if: steps.cache.outputs.cache-hit != 'true'
      - if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run fetch-llvm
      - name: Keep it
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/firmware/*/llvm-*
          key: ${{ steps.cache.outputs.cache-primary-key }}

  fetch-zephyr:
    # Zephyr itself, at its tag, and a venv with what its build scripts and
    # twister import, whose Python is a program for the runner's system and
    # processor: uv's own, which runs on any Ubuntu, with packages that are
    # manylinux wheels, which do too. Cached as the SDK is.
    name: Zephyr (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - name: Look for it in the cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/firmware/.west
            build/firmware/*/python
            build/firmware/*/venv
            build/firmware/zephyr
          key: zephyr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml', 'firmware/twister-requirements.txt') }}
          lookup-only: true
      - uses: astral-sh/setup-uv@v7
        if: steps.cache.outputs.cache-hit != 'true'
      - if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run fetch-zephyr
      - name: Keep it
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/firmware/.west
            build/firmware/*/python
            build/firmware/*/venv
            build/firmware/zephyr
          key: ${{ steps.cache.outputs.cache-primary-key }}

  firmware-rom:
    # The boot ROMs, and sbi_payload, built with the SDK's compiler. An ELF
    # image is the same file whatever machine the simulator runs on, so
    # each part of the firmware is built once, here, and handed to the
    # jobs that boot it. Each is cached on what it is built from.
    name: Firmware (the boot ROMs)
    needs: fetch-sdk
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache the images
        id: images
        uses: actions/cache@v6
        with:
          path: |
            build/firmware/rom_*.bin
            build/firmware/rom_*.elf
            build/firmware/sbi_payload.bin
            build/firmware/sbi_payload.elf
          key: firmware-rom-${{ hashFiles('firmware/rom/**', 'firmware/sbi_payload/**', 'python/socpuppet/zephyr_module/include/**', 'firmware/build.py', 'firmware/versions.toml') }}
      - name: Restore the Zephyr SDK
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/zephyr-sdk-*
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v7
        if: steps.images.outputs.cache-hit != 'true'
      - if: steps.images.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run firmware-rom
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-rom
          path: |
            build/firmware/rom_*.bin
            build/firmware/rom_*.elf
            build/firmware/sbi_payload.bin
            build/firmware/sbi_payload.elf
          if-no-files-found: error

  firmware-opensbi:
    # OpenSBI for the host, built with the SDK's LLVM, and patched.
    name: Firmware (OpenSBI)
    needs: fetch-llvm
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache the images
        id: images
        uses: actions/cache@v6
        with:
          path: |
            build/firmware/fw_jump.bin
            build/firmware/fw_jump.elf
            build/firmware/test_payload.bin
            build/firmware/test_payload.elf
          key: firmware-opensbi-${{ hashFiles('cmake/patches/opensbi-*', 'firmware/build.py', 'firmware/versions.toml') }}
      - name: Restore the SDK's LLVM
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/llvm-*
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v7
        if: steps.images.outputs.cache-hit != 'true'
      - if: steps.images.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run firmware-opensbi
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-opensbi
          path: |
            build/firmware/fw_jump.bin
            build/firmware/fw_jump.elf
            build/firmware/test_payload.bin
            build/firmware/test_payload.elf
          if-no-files-found: error

  firmware-zephyr:
    # Zephyr's images, for the boards. The board an image is built for is
    # part of what it is. What twister is run from builds no image: its
    # script, its lists, and what it reads of each application.
    name: Firmware (Zephyr's images)
    needs: [fetch-sdk, fetch-zephyr]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache the images
        id: images
        uses: actions/cache@v6
        with:
          path: |
            build/firmware/*_qemu_riscv*.elf
            build/firmware/*_qemu_riscv*.bin
            build/firmware/*_qemu_riscv*.opcodes.txt
            build/firmware/*_socpuppet_*.elf
            build/firmware/*_socpuppet_*.bin
            build/firmware/*_socpuppet_*.opcodes.txt
          key: firmware-zephyr-${{ hashFiles('firmware/**', '!firmware/twister*', '!firmware/**/testcase.yaml', 'python/socpuppet/zephyr_module/**') }}
      - name: Restore the Zephyr SDK
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/zephyr-sdk-*
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          fail-on-cache-miss: true
      - name: Restore Zephyr and its venv
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            build/firmware/.west
            build/firmware/*/python
            build/firmware/*/venv
            build/firmware/zephyr
          key: zephyr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml', 'firmware/twister-requirements.txt') }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v7
        if: steps.images.outputs.cache-hit != 'true'
      - if: steps.images.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run firmware-zephyr
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-zephyr
          path: |
            build/firmware/*_qemu_riscv*.elf
            build/firmware/*_qemu_riscv*.bin
            build/firmware/*_qemu_riscv*.opcodes.txt
            build/firmware/*_socpuppet_*.elf
            build/firmware/*_socpuppet_*.bin
            build/firmware/*_socpuppet_*.opcodes.txt
          if-no-files-found: error

  firmware-edk2:
    # EDK2, UEFI, for the host, built with the SDK's LLVM, and patched.
    name: Firmware (EDK2)
    needs: fetch-llvm
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache the images
        id: images
        uses: actions/cache@v6
        with:
          path: |
            build/firmware/uefi.fd
            build/firmware/uefi_shell.efi
          key: firmware-edk2-${{ hashFiles('cmake/patches/edk2-*', 'firmware/build.py', 'firmware/versions.toml') }}
      # EDK2's BaseTools are built with the runner's own gcc, and want
      # libuuid's header; and EDK2 compiles ACPI tables with iasl.
      - name: Install system packages
        if: steps.images.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y uuid-dev acpica-tools
      - name: Restore the SDK's LLVM
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/llvm-*
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v7
        if: steps.images.outputs.cache-hit != 'true'
      - if: steps.images.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run firmware-edk2
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-edk2
          path: |
            build/firmware/uefi.fd
            build/firmware/uefi_shell.efi
          if-no-files-found: error

  firmware-linux:
    # Linux, a stock defconfig kernel for the host, built with the SDK's
    # LLVM from the release tarball its pin names, its root filesystem, and
    # the initramfs that loads its NVMe modules.
    name: Firmware (Linux)
    needs: fetch-llvm
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache the images
        id: images
        uses: actions/cache@v6
        with:
          path: |
            build/firmware/linux.bin
            build/firmware/linux.elf
            build/firmware/linux.map
            build/firmware/rootfs.ext4
            build/firmware/initramfs.cpio
          key: firmware-linux-${{ hashFiles('firmware/rootfs/**', 'firmware/initramfs/**', 'firmware/build.py', 'firmware/versions.toml') }}
      # The kernel's build generates its parsers with flex and bison and
      # does its arithmetic with bc; its host tools are built with the
      # runner's own gcc; and its root filesystem is made by mkfs.ext4.
      - name: Install system packages
        if: steps.images.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y flex bison bc e2fsprogs
      - name: Restore the SDK's LLVM
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/llvm-*
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v7
        if: steps.images.outputs.cache-hit != 'true'
      - if: steps.images.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run firmware-linux
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-linux
          path: |
            build/firmware/linux.bin
            build/firmware/linux.elf
            build/firmware/linux.map
            build/firmware/rootfs.ext4
            build/firmware/initramfs.cpio
          if-no-files-found: error

  test-quick:
    # The dev tree's build and its tests but those marked long
    # (tests/python/conftest.py), which take most of the time and are
    # nightly.yml's.
    name: Build and test, but the long tests (${{ matrix.os }})
    needs: [firmware-rom, firmware-opensbi, firmware-zephyr, firmware-edk2, firmware-linux]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler libslirp-dev
      - name: Install the devicetree compiler and libslirp
        if: runner.os == 'macOS'
        run: brew install dtc libslirp
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - name: Take the firmware the firmware jobs built
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: build/firmware
      - run: uv run python tools/ci.py run test-quick

  tidy:
    # clang-tidy over our own C++, and each of our headers compiled on its
    # own. Nothing else is built: clang-tidy reads the sources and the
    # compile commands that configuring writes, which are GCC's on Linux
    # and Apple clang's on a Mac, each with its own standard library, so a
    # system's leg checks our code the way that system compiles it.
    name: clang-tidy and header check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv run python tools/ci.py run tidy

  coverage:
    # Which lines of our own C++ and Python the tests run. The job fails if
    # either falls below its floor (CMakePresets.json).
    name: Test coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler libslirp-dev
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-ubuntu-26.04-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv run python tools/ci.py run coverage
      - name: Show the figures on the job's page
        if: always()
        run: |
          {
            cat build/dev/coverage/cpp.md
            echo
            echo "# Python coverage"
            echo
            uv run python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the line-by-line reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/dev/coverage

  sanitizers:
    # The C++ tests again, built so that a memory error or undefined
    # behavior stops the program instead of passing unnoticed.
    name: C++ tests under sanitizers
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-ubuntu-26.04-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv run python tools/ci.py run sanitizers

