name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Formatting and static checks on every file, with nothing to build
    # first. ctest runs the same thing; this job says so in seconds.
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python tools/lint.py

  test:
    name: Build and test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.13"]
        include:
          # The oldest Python we support, and the newest. 3.14 changed how
          # CPython guards against stack overflow, which is what the
          # PythonExecutor exists to stay clear of.
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.14"
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v6
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/dev/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv sync
      - run: uv run cmake --preset dev
      - run: uv run cmake --build --preset dev
      - run: uv run ctest --preset dev

  tidy:
    # clang-tidy over our own C++, and each of our headers compiled on its
    # own. Nothing else is built: clang-tidy reads the sources and the
    # compile commands that configuring writes.
    #
    # It runs on macOS because on Ubuntu 24.04 clang-tidy cannot parse one of
    # SCC's bundled headers (CCI) against GCC 13's standard library, and what
    # it then says about our code cannot be trusted. See docs/style.md.
    name: clang-tidy and header check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/dev/_deps
          key: deps-macos-15-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv sync
      - run: uv run cmake --preset dev
      - run: uv run cmake --build --preset dev --target tidy
      - run: uv run cmake --build --preset dev --target check_headers

  coverage:
    # Which lines of our own C++ and Python the tests run. The job fails if
    # either falls below its floor (CMakePresets.json).
    name: Test coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v6
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/dev/_deps
          key: deps-ubuntu-24.04-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv sync
      - run: uv run cmake --preset coverage
      - run: uv run cmake --build --preset coverage --target coverage
      - name: Show the figures on the job's page
        if: always()
        run: |
          {
            cat build/dev/coverage/cpp.md
            echo
            echo "# Python coverage"
            echo
            uv run python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the line-by-line reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/dev/coverage

  sanitizers:
    # The C++ tests again, built so that a memory error or undefined
    # behavior stops the program instead of passing unnoticed.
    name: C++ tests under sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v6
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/dev/_deps
          key: deps-ubuntu-24.04-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv sync
      - run: uv run cmake --preset asan
      - run: uv run cmake --build --preset asan
      - run: uv run ctest --preset asan

  wheel:
    name: Wheel, installed with uv and pip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel
      - run: uv run --no-project python tools/check_wheel.py dist/*.whl
      - run: tools/test_wheel.sh uv dist/*.whl
      - run: tools/test_wheel.sh pip dist/*.whl

  devcontainer:
    name: Build and test (devcontainer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            devcontainer:
              - '.devcontainer/**'
      - name: Build the image and run the tests inside it
        if: steps.changed.outputs.devcontainer == 'true'
        run: |
          docker build -t socpuppet-dev .devcontainer
          # The checkout belongs to the runner's user and the container runs
          # as root, so git has to be told the mounted directory is safe to
          # read. The lint test lists files with git.
          docker run --rm -v "$PWD:/workspace" -w /workspace socpuppet-dev \
            bash -c "git config --global --add safe.directory /workspace && uv sync && uv run cmake --preset dev && uv run cmake --build --preset dev && uv run ctest --preset dev"
