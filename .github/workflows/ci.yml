name: CI

# The quick tier, on every push to main and every pull request, on Linux
# alone: lint, the firmware, the quick tests with one boot of each area on
# both harts, and clang-tidy, the quick tests' coverage and the
# sanitizers. The rest is nightly.yml's: every other boot, twister, the
# whole suite's coverage, QBox, the wheels and the devcontainer, on every
# machine CI has. On a developer's machine,
# `uv run python tools/ci.py` runs that, and `--quick` runs this.
#
# Every job here but the last is a thin wrapper around tools/ci.py, which
# holds each job's steps: what is left is GitHub's plumbing, the checkout,
# then the setup every job takes from .github/actions/setup (the packages,
# the caches and the artifacts). A job's log opens with the command that
# runs the same job on a developer's machine. The jobs this tier shares
# with nightly.yml are in the workflows both call, firmware.yml, checks.yml,
# qbox-build.yml and tidy.yml, each given the machines this tier runs it on
# but checks.yml, whose jobs run on Linux alone.
# tests/tooling/test_ci_workflow.py keeps the workflows to the jobs
# tools/ci.py runs. The last job, CI passed, waits for all the others and
# fails if one of them did: it is the one check main's ruleset requires.
#
# Nothing waits for lint but CI passed: a job waits only for a job whose
# output it reads, or, for the release of the images, whose verdict it does.
#
# There is no Mac here. GitHub runs five Macs at a time for an account,
# and a pull request pushed in the evening waits behind nightly.yml's: a
# Mac leg made the quick tier as slow as the queue. What breaks on a Mac
# alone is found at night, on every Mac nightly.yml runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request stops the run of the one before. A run on
# main always finishes, since main's caches are the ones every branch reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  firmware:
    name: Firmware
    uses: ./.github/workflows/firmware.yml
    with:
      os: '["ubuntu-26.04"]'

  test-quick:
    # The dev tree's build and its quick tests: all but the long ones, and
    # one boot for each area (the quick test preset); the rest of the boots
    # are nightly.yml's.
    name: Build and quick tests (${{ matrix.os }})
    needs: firmware
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build cable
          machine: ${{ matrix.os }}
          tree: dev
          firmware: firmware-*
          compiler-cache: dev
      - run: uv run python tools/ci.py run test-quick

  coverage-quick:
    # Which lines of our own C++ and Python the quick preset's tests run,
    # one boot of each area. The job fails if either falls below the floors
    # it shares with nightly.yml's coverage of the whole suite
    # (CMakePresets.json).
    name: Test coverage of the quick tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build cable
          machine: ubuntu-26.04
          tree: dev
          compiler-cache: coverage
      - run: uv run python tools/ci.py run coverage-quick
      - name: Show the figures on the job's page
        if: always()
        run: |
          {
            cat build/dev/coverage/cpp.md
            echo
            echo "# Python coverage"
            echo
            uv run python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the line-by-line reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-quick-report
          path: build/dev/coverage

  qbox-build:
    name: QBox
    uses: ./.github/workflows/qbox-build.yml
    with:
      os: '["ubuntu-26.04"]'

  tidy:
    # After QBox's build, whose tree it checks; nothing waits for it but
    # CI passed.
    name: Tidy
    needs: qbox-build
    uses: ./.github/workflows/tidy.yml
    with:
      os: '["ubuntu-26.04"]'

  qbox-quick:
    # The quick preset's second opinion: the quick tests and one boot for
    # each area on QBox's CPU (docs/models/qbox-cpu.md), where a boot of
    # Linux takes seconds. Every boot on both harts is nightly.yml's.
    name: Quick tests with QBox's CPU (${{ matrix.os }})
    needs: [firmware, qbox-build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build cable qbox
          machine: ${{ matrix.os }}
          tree: qbox-dev
          firmware: firmware-*
          qbox: true
          compiler-cache: qbox-dev
      - run: uv run python tools/ci.py run qbox-quick

  images:
    # The release a wheel fetches its images from, named for what they are
    # built from: published by main's first run to pass with new sources,
    # so that what is published has been booted, and left alone after that.
    # The one job that may write to the repository, and only on main: not on
    # a pull request, whose packages nobody has read yet.
    name: The images' release
    if: github.ref == 'refs/heads/main'
    needs: [firmware, test-quick, qbox-quick]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          firmware: firmware-*
      - run: uv run python tools/ci.py run images
        env:
          GH_TOKEN: ${{ github.token }}

  ci-passed:
    # The one check main's ruleset requires, so that a pull request can
    # merge itself once it is green: it needs every other job here, and
    # stands for them all. It runs whatever they did, since a job whose
    # needs failed is skipped, and GitHub counts a required check that was
    # skipped as passed. Not !cancelled(): a run cancelled by hand would
    # skip it too, and merge what it never tested. It fails when a job it
    # needs failed or was cancelled, and passes when one was skipped by its
    # own condition, as GitHub counts it.
    name: CI passed
    if: always()
    needs: [checks, firmware, test-quick, coverage-quick, qbox-build, tidy, qbox-quick, images]
    runs-on: ubuntu-26.04
    steps:
      - name: A job it needs failed or was cancelled (see the run's summary)
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
        run: exit 1
