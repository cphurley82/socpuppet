name: CI

# Every job here is a thin wrapper around tools/ci.py, which holds each
# job's steps: what is left in this file is GitHub's plumbing, the checkout,
# the packages, the caches and the artifacts. A job's log opens with the
# command that runs the same job on a developer's machine, and
# `uv run python tools/ci.py` runs every one that can run there.
# tests/tooling/test_ci_workflow.py keeps the two to the same jobs.
#
# Nothing waits for lint: a job waits only for a job whose output it reads.
#
# The Macs are Apple silicon (macos-15) and Intel (macos-26-intel and
# macos-15-intel). An Intel Mac runs here what it runs natively, as
# tools/ci.py runs it there; what it builds in the devcontainer's image,
# the firmware and twister, it does not, as GitHub's Macs have no Docker.
# macos-26-intel runs each of those jobs but qbox-tidy; macos-15-intel, an
# older Xcode and SDK, only the quick ones, test and tidy. qbox-tidy there
# ran for 50 minutes and then lost its runner, most likely to a lack of
# memory, and it would add little: the Intel Mac's QBox build already meets
# Homebrew's /usr/local, and the Apple silicon Mac checks the adapter with
# Apple clang.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request stops the run of the one before. A run on
# main always finishes, since main's caches are the ones every branch reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Formatting and static checks on every file, with nothing to build
    # first. ctest runs the same thing; this job says so in seconds.
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run python tools/ci.py run lint

  fetch-sdk:
    # The Zephyr SDK's RISC-V toolchain, for the machine it runs on, kept
    # in a cache keyed on its version, and fetched only when that changes.
    # The jobs that build with it restore it from there. Its tools are
    # prebuilt to run on any Linux, so the key names the runner's system
    # and processor and not its Ubuntu: one copy serves 24.04 and 26.04.
    name: Zephyr SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Look for it in the cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/zephyr-sdk-*
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          lookup-only: true
      - uses: astral-sh/setup-uv@v7
        if: steps.cache.outputs.cache-hit != 'true'
      - if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run fetch-sdk
      - name: Keep it
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/firmware/*/zephyr-sdk-*
          key: ${{ steps.cache.outputs.cache-primary-key }}

  fetch-llvm:
    # The SDK's LLVM, which builds OpenSBI and EDK2: two gigabytes, so
    # kept apart from the SDK, and cached as it is.
    name: Zephyr SDK's LLVM
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Look for it in the cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/llvm-*
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          lookup-only: true
      - uses: astral-sh/setup-uv@v7
        if: steps.cache.outputs.cache-hit != 'true'
      - if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run fetch-llvm
      - name: Keep it
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/firmware/*/llvm-*
          key: ${{ steps.cache.outputs.cache-primary-key }}

  fetch-zephyr:
    # Zephyr itself, at its tag, and a venv with what its build scripts and
    # twister import, whose Python is a program for the runner's system and
    # processor: uv's own, which runs on any Ubuntu, with packages that are
    # manylinux wheels, which do too. Cached as the SDK is.
    name: Zephyr (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Look for it in the cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/firmware/.west
            build/firmware/*/python
            build/firmware/*/venv
            build/firmware/zephyr
          key: zephyr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml', 'firmware/twister-requirements.txt') }}
          lookup-only: true
      - uses: astral-sh/setup-uv@v7
        if: steps.cache.outputs.cache-hit != 'true'
      - if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run fetch-zephyr
      - name: Keep it
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/firmware/.west
            build/firmware/*/python
            build/firmware/*/venv
            build/firmware/zephyr
          key: ${{ steps.cache.outputs.cache-primary-key }}

  firmware-rom:
    # The boot ROMs, and sbi_payload, built with the SDK's compiler. An ELF
    # image is the same file whatever machine the simulator runs on, so
    # each part of the firmware is built once, here, and handed to the
    # jobs that boot it. Each is cached on what it is built from.
    name: Firmware (the boot ROMs)
    needs: fetch-sdk
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache the images
        id: images
        uses: actions/cache@v6
        with:
          path: |
            build/firmware/rom_*.bin
            build/firmware/rom_*.elf
            build/firmware/sbi_payload.bin
            build/firmware/sbi_payload.elf
          key: firmware-rom-${{ hashFiles('firmware/rom/**', 'firmware/sbi_payload/**', 'python/socpuppet/zephyr_module/include/**', 'firmware/build.py', 'firmware/versions.toml') }}
      - name: Restore the Zephyr SDK
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/zephyr-sdk-*
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v7
        if: steps.images.outputs.cache-hit != 'true'
      - if: steps.images.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run firmware-rom
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-rom
          path: |
            build/firmware/rom_*.bin
            build/firmware/rom_*.elf
            build/firmware/sbi_payload.bin
            build/firmware/sbi_payload.elf
          if-no-files-found: error

  firmware-opensbi:
    # OpenSBI for the host, built with the SDK's LLVM, and patched.
    name: Firmware (OpenSBI)
    needs: fetch-llvm
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache the images
        id: images
        uses: actions/cache@v6
        with:
          path: |
            build/firmware/fw_jump.bin
            build/firmware/fw_jump.elf
            build/firmware/test_payload.bin
            build/firmware/test_payload.elf
          key: firmware-opensbi-${{ hashFiles('cmake/patches/opensbi-*', 'firmware/build.py', 'firmware/versions.toml') }}
      - name: Restore the SDK's LLVM
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/llvm-*
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v7
        if: steps.images.outputs.cache-hit != 'true'
      - if: steps.images.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run firmware-opensbi
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-opensbi
          path: |
            build/firmware/fw_jump.bin
            build/firmware/fw_jump.elf
            build/firmware/test_payload.bin
            build/firmware/test_payload.elf
          if-no-files-found: error

  firmware-zephyr:
    # Zephyr's images, for the boards. The board an image is built for is
    # part of what it is. What twister is run from builds no image: its
    # script, its lists, and what it reads of each application.
    name: Firmware (Zephyr's images)
    needs: [fetch-sdk, fetch-zephyr]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache the images
        id: images
        uses: actions/cache@v6
        with:
          path: |
            build/firmware/*_qemu_riscv*.elf
            build/firmware/*_qemu_riscv*.bin
            build/firmware/*_qemu_riscv*.opcodes.txt
            build/firmware/*_socpuppet_*.elf
            build/firmware/*_socpuppet_*.bin
            build/firmware/*_socpuppet_*.opcodes.txt
          key: firmware-zephyr-${{ hashFiles('firmware/**', '!firmware/twister*', '!firmware/**/testcase.yaml', 'python/socpuppet/zephyr_module/**') }}
      - name: Restore the Zephyr SDK
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/zephyr-sdk-*
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          fail-on-cache-miss: true
      - name: Restore Zephyr and its venv
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            build/firmware/.west
            build/firmware/*/python
            build/firmware/*/venv
            build/firmware/zephyr
          key: zephyr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml', 'firmware/twister-requirements.txt') }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v7
        if: steps.images.outputs.cache-hit != 'true'
      - if: steps.images.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run firmware-zephyr
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-zephyr
          path: |
            build/firmware/*_qemu_riscv*.elf
            build/firmware/*_qemu_riscv*.bin
            build/firmware/*_qemu_riscv*.opcodes.txt
            build/firmware/*_socpuppet_*.elf
            build/firmware/*_socpuppet_*.bin
            build/firmware/*_socpuppet_*.opcodes.txt
          if-no-files-found: error

  firmware-edk2:
    # EDK2, UEFI, for the host, built with the SDK's LLVM, and patched.
    name: Firmware (EDK2)
    needs: fetch-llvm
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache the images
        id: images
        uses: actions/cache@v6
        with:
          path: |
            build/firmware/uefi.fd
          key: firmware-edk2-${{ hashFiles('cmake/patches/edk2-*', 'firmware/build.py', 'firmware/versions.toml') }}
      # EDK2's BaseTools are built with the runner's own gcc, and want
      # libuuid's header; and EDK2 compiles ACPI tables with iasl.
      - name: Install system packages
        if: steps.images.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y uuid-dev acpica-tools
      - name: Restore the SDK's LLVM
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/llvm-*
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v7
        if: steps.images.outputs.cache-hit != 'true'
      - if: steps.images.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run firmware-edk2
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-edk2
          path: |
            build/firmware/uefi.fd
          if-no-files-found: error

  firmware-linux:
    # Linux, a stock defconfig kernel for the host, built with the SDK's
    # LLVM from the release tarball its pin names.
    name: Firmware (Linux)
    needs: fetch-llvm
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache the images
        id: images
        uses: actions/cache@v6
        with:
          path: |
            build/firmware/linux.bin
            build/firmware/linux.elf
            build/firmware/linux.map
            build/firmware/rootfs.ext4
          key: firmware-linux-${{ hashFiles('firmware/rootfs/**', 'firmware/build.py', 'firmware/versions.toml') }}
      # The kernel's build generates its parsers with flex and bison and
      # does its arithmetic with bc; its host tools are built with the
      # runner's own gcc; and its root filesystem is made by mkfs.ext4.
      - name: Install system packages
        if: steps.images.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y flex bison bc e2fsprogs
      - name: Restore the SDK's LLVM
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/llvm-*
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v7
        if: steps.images.outputs.cache-hit != 'true'
      - if: steps.images.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run firmware-linux
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-linux
          path: |
            build/firmware/linux.bin
            build/firmware/linux.elf
            build/firmware/linux.map
            build/firmware/rootfs.ext4
          if-no-files-found: error

  test:
    name: Build and test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [firmware-rom, firmware-opensbi, firmware-zephyr, firmware-edk2, firmware-linux]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 too, the oldest we support, with its older GCC (13)
        # and system libraries.
        os: [ubuntu-26.04, ubuntu-24.04, macos-15, macos-26-intel, macos-15-intel]
        # The Python the tools are pinned to (.python-version). The oldest
        # and the newest we support are tested by the wheel job, which
        # builds a wheel for each and runs the Python tests against it.
        # That matters for 3.14, which changed how CPython guards against
        # stack overflow: the PythonExecutor exists to stay clear of that.
        python: ["3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      # dtc checks the devicetrees the boards generate and compiles the one
      # a boot under OpenSBI is handed. Without it those tests skip here.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - name: Install the devicetree compiler
        if: runner.os == 'macOS'
        run: brew install dtc
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - name: Take the firmware the firmware jobs built
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: build/firmware
      - run: uv run python tools/ci.py run test

  tidy:
    # clang-tidy over our own C++, and each of our headers compiled on its
    # own. Nothing else is built: clang-tidy reads the sources and the
    # compile commands that configuring writes, which are GCC's on Linux
    # and Apple clang's on a Mac, each with its own standard library.
    name: clang-tidy and header check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, macos-26-intel, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv run python tools/ci.py run tidy

  twister:
    # Zephyr's own test suites, and ours, run on every board by twister,
    # Zephyr's test runner, with socpuppet as the emulator: the
    # board-compliance run (docs/twister.md). Twister builds an image and
    # runs it in one breath, so this one job has both what builds firmware
    # and what runs it: Zephyr, its SDK and its venv, from their caches.
    #
    # On Linux and on a Mac. The Mac's runner is Apple silicon, the one Mac
    # the Zephyr SDK has a toolchain for, and so the one place twister runs
    # on macOS itself: an Intel Mac runs it in the devcontainer's image,
    # and so not here.
    name: Twister (Zephyr's tests on the boards, ${{ matrix.os }})
    needs: [fetch-sdk, fetch-zephyr, firmware-rom]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - name: Restore the Zephyr SDK
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/zephyr-sdk-*
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          fail-on-cache-miss: true
      - name: Restore Zephyr and its venv
        uses: actions/cache/restore@v6
        with:
          path: |
            build/firmware/.west
            build/firmware/*/python
            build/firmware/*/venv
            build/firmware/zephyr
          key: zephyr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml', 'firmware/twister-requirements.txt') }}
          fail-on-cache-miss: true
      # The boot ROMs, which every run starts in.
      - uses: actions/download-artifact@v8
        with:
          name: firmware-rom
          path: build/firmware
      - run: uv run python tools/ci.py run twister
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: twister-${{ matrix.os }}
          # The verdicts, twister's own account of each run, and each
          # scenario's build log, its console, and what the emulator said
          # of how the run ended.
          path: |
            build/twister/out/*/twister.json
            build/twister/out/*/twister*.xml
            build/twister/out/*/twister.log
            build/twister/out/**/build.log
            build/twister/out/**/handler.log
            build/twister/out/**/handler_stderr.log

  coverage:
    # Which lines of our own C++ and Python the tests run. The job fails if
    # either falls below its floor (CMakePresets.json).
    name: Test coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-ubuntu-26.04-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv run python tools/ci.py run coverage
      - name: Show the figures on the job's page
        if: always()
        run: |
          {
            cat build/dev/coverage/cpp.md
            echo
            echo "# Python coverage"
            echo
            uv run python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the line-by-line reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/dev/coverage

  sanitizers:
    # The C++ tests again, built so that a memory error or undefined
    # behavior stops the program instead of passing unnoticed.
    name: C++ tests under sanitizers
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-ubuntu-26.04-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv run python tools/ci.py run sanitizers

  qbox-build:
    # QBox, Qualcomm's QEMU in SystemC, which the qbox_cpu is built on. It
    # is GPL-2.0 and built from source, which takes a quarter of an hour on
    # CI's Linux runner, so what it installs is cached, keyed on QBox's pin
    # and its patches, and this job builds it only when those change. The
    # system's libraries it links are the runner's, so the key names the
    # runner too.
    name: QBox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 too, the oldest we support: QBox links more of the
        # system's libraries than anything else, and they differ most there.
        os: [ubuntu-26.04, ubuntu-24.04, macos-15, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - name: Look for QBox in the cache
        id: qbox
        uses: actions/cache/restore@v6
        with:
          path: build/qbox/install
          key: qbox-${{ matrix.os }}-${{ hashFiles('tools/build_qbox.py', 'cmake/patches/qbox-*', 'cmake/patches/libqemu-*') }}
          lookup-only: true
      - name: Install QBox's packages
        # As the devcontainer's image has them (.devcontainer/Dockerfile).
        if: steps.qbox.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex libasio-dev libelf-dev libepoxy-dev libglib2.0-dev \
            libjpeg-turbo8-dev libpixman-1-dev libsdl2-dev libslirp-dev \
            libvirglrenderer-dev libzip-dev lld llvm meson ninja-build \
            ocl-icd-opencl-dev pkg-config python3-dev python3-pip python3-venv
      - name: Install QBox's packages
        # As docs/setup.md lists them for a Mac.
        if: steps.qbox.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: |
          brew install asio glib jpeg-turbo libelf libslirp libzip meson \
            ninja pixman pkgconf sdl2
      - uses: astral-sh/setup-uv@v7
        if: steps.qbox.outputs.cache-hit != 'true'
      - if: steps.qbox.outputs.cache-hit != 'true'
        run: uv run python tools/ci.py run qbox-build
      - name: Keep QBox
        if: steps.qbox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/qbox/install
          key: ${{ steps.qbox.outputs.cache-primary-key }}

  qbox-tidy:
    # clang-tidy over the adapter of QBox's CPU, which the tidy job's tree
    # leaves out.
    name: clang-tidy and header check with QBox (${{ matrix.os }})
    needs: qbox-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        # socpuppet's, and QBox's (.devcontainer/Dockerfile).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev device-tree-compiler \
            bison flex libasio-dev libelf-dev libepoxy-dev libglib2.0-dev \
            libjpeg-turbo8-dev libpixman-1-dev libsdl2-dev libslirp-dev \
            libvirglrenderer-dev libzip-dev lld llvm meson ninja-build \
            ocl-icd-opencl-dev pkg-config python3-dev python3-pip python3-venv
      - name: Install QBox's packages
        # As docs/setup.md lists them for a Mac.
        if: runner.os == 'macOS'
        run: |
          brew install asio glib jpeg-turbo libelf libslirp libzip meson \
            ninja pixman pkgconf sdl2
      - uses: astral-sh/setup-uv@v7
      - name: Restore QBox
        uses: actions/cache/restore@v6
        with:
          path: build/qbox/install
          key: qbox-${{ matrix.os }}-${{ hashFiles('tools/build_qbox.py', 'cmake/patches/qbox-*', 'cmake/patches/libqemu-*') }}
          fail-on-cache-miss: true
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/qbox-dev/_deps
          key: deps-qbox-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv run python tools/ci.py run qbox-tidy

  qbox:
    # The qbox_cpu, QEMU's RISC-V CPU inside SystemC, as a second hart
    # beside DBT-RISE's (docs/models/qbox-cpu.md): the bus-master contract,
    # the hart's suite with QBox's fates skipped, the Python boots of the
    # host, and twister's suites on the host board.
    #
    # On Linux, and on a Mac natively, with Homebrew's packages
    # (docs/setup.md): nothing but this leg would say that the patches
    # QBox needs on a Mac (docs/upstream.md) had stopped working there.
    # An Intel Mac stops before twister, which it runs in the
    # devcontainer's image, and so needs neither Zephyr nor its SDK.
    name: Build and test with QBox's CPU (${{ matrix.os }})
    needs:
      - fetch-sdk
      - fetch-zephyr
      - firmware-rom
      - firmware-opensbi
      - firmware-zephyr
      - firmware-edk2
      - firmware-linux
      - qbox-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 too, as qbox-build is.
        os: [ubuntu-26.04, ubuntu-24.04, macos-15, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        # socpuppet's and the firmware's, and QBox's
        # (.devcontainer/Dockerfile).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev device-tree-compiler uuid-dev acpica-tools \
            bison flex libasio-dev libelf-dev libepoxy-dev libglib2.0-dev \
            libjpeg-turbo8-dev libpixman-1-dev libsdl2-dev libslirp-dev \
            libvirglrenderer-dev libzip-dev lld llvm meson ninja-build \
            ocl-icd-opencl-dev pkg-config python3-dev python3-pip python3-venv
      - name: Install Homebrew's packages
        # QBox's, as docs/setup.md lists them for a Mac, and dtc.
        if: runner.os == 'macOS'
        run: |
          brew install acpica asio dtc glib jpeg-turbo libelf libslirp libzip \
            meson ninja pixman pkgconf sdl2
      - uses: astral-sh/setup-uv@v7
      - name: Restore QBox
        uses: actions/cache/restore@v6
        with:
          path: build/qbox/install
          key: qbox-${{ matrix.os }}-${{ hashFiles('tools/build_qbox.py', 'cmake/patches/qbox-*', 'cmake/patches/libqemu-*') }}
          fail-on-cache-miss: true
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/qbox-dev/_deps
          key: deps-qbox-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - name: Restore the Zephyr SDK
        if: ${{ !endsWith(matrix.os, '-intel') }}
        uses: actions/cache/restore@v6
        with:
          path: build/firmware/*/zephyr-sdk-*
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
          fail-on-cache-miss: true
      - name: Restore Zephyr and its venv
        if: ${{ !endsWith(matrix.os, '-intel') }}
        uses: actions/cache/restore@v6
        with:
          path: |
            build/firmware/.west
            build/firmware/*/python
            build/firmware/*/venv
            build/firmware/zephyr
          key: zephyr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml', 'firmware/twister-requirements.txt') }}
          fail-on-cache-miss: true
      - name: Take the firmware the firmware jobs built
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: build/firmware
      - run: uv run python tools/ci.py run qbox
      - uses: actions/upload-artifact@v7
        if: ${{ always() && !endsWith(matrix.os, '-intel') }}
        with:
          name: twister-qbox-${{ matrix.os }}
          path: |
            build/twister/out/*/twister.json
            build/twister/out/*/twister*.xml
            build/twister/out/*/twister.log
            build/twister/out/**/build.log
            build/twister/out/**/handler.log
            build/twister/out/**/handler_stderr.log

  wheel:
    # The wheels a user will install, built by cibuildwheel as configured in
    # pyproject.toml: one per Python version, for Linux on Intel and Arm
    # (manylinux) and for macOS on Apple silicon and on Intel. cibuildwheel
    # installs each into a fresh environment and runs the Python tests
    # against it, and then one is installed the way a user would, with uv
    # and with pip, and boots real firmware. Nothing is published from here.
    #
    # Nearly all of a wheel is the dependencies, which are the same for
    # every Python version. A compiler cache (ccache, set up in
    # pyproject.toml) lets the second and third wheel take them from the
    # first, and keeping the cache from one run to the next lets the first
    # take them from last time. On Linux the build runs in a container,
    # which sees the runner's files under /host.
    name: Portable wheels (${{ matrix.os }})
    needs: [firmware-rom, firmware-opensbi, firmware-zephyr, firmware-edk2, firmware-linux]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-15, macos-26-intel]
    env:
      CCACHE_DIR: ${{ startsWith(matrix.os, 'ubuntu') && '/host/home/runner/.cache/ccache' || '/Users/runner/Library/Caches/ccache' }}
      CCACHE_COMPRESS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Cache compiled dependencies
        uses: actions/cache@v6
        with:
          path: ${{ startsWith(matrix.os, 'ubuntu') && '/home/runner/.cache/ccache' || '/Users/runner/Library/Caches/ccache' }}
          # Saved once for each set of dependencies. Our own few files are
          # compiled every time, which is what a change to them needs.
          key: ccache-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**', 'pyproject.toml') }}
      # dtc compiles the devicetree a boot under OpenSBI is handed.
      - name: Install the devicetree compiler
        run: |
          if [[ $RUNNER_OS == macOS ]]; then
            brew install dtc
          else
            sudo apt-get update && sudo apt-get install -y device-tree-compiler
          fi
      - name: Take the firmware the firmware jobs built
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: build/firmware
      - run: uv run python tools/ci.py run wheel
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: build/wheelhouse/*.whl

  devcontainer:
    # The tests, built in the devcontainer's image: Linux with GCC, which
    # is what a contributor's editor builds in. Only when the image changes.
    name: Build and test (devcontainer)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            devcontainer:
              - '.devcontainer/**'
      - if: steps.changed.outputs.devcontainer == 'true'
        run: uv run python tools/ci.py run devcontainer
