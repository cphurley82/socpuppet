name: CI

# The quick tier, on every push to main and every pull request: lint, the
# firmware, the quick tests with one boot of each area, on Linux on both
# harts and on an Apple silicon Mac, and clang-tidy, coverage and the
# sanitizers on Linux. It answers in about half an hour. The rest
# is nightly.yml's: every other boot, twister, QBox, the wheels and the
# devcontainer, on every machine CI has. On a developer's machine,
# `uv run python tools/ci.py` runs that, and `--quick` runs this.
#
# Every job here but the last is a thin wrapper around tools/ci.py, which
# holds each job's steps: what is left is GitHub's plumbing, the checkout,
# then the setup every job takes from .github/actions/setup (the packages,
# the caches and the artifacts). A job's log opens with the command that
# runs the same job on a developer's machine. The jobs this tier shares
# with nightly.yml are in the workflows both call, firmware.yml, checks.yml
# and qbox-build.yml, each given the machines this tier runs it on.
# tests/tooling/test_ci_workflow.py keeps the workflows to the jobs
# tools/ci.py runs. The last job, CI passed, waits for all the others and
# runs nothing of its own: it is the one check main's ruleset requires.
#
# Nothing waits for lint but CI passed: a job waits only for a job whose
# output it reads.
#
# The one Mac here is Apple silicon, macos-latest, which runs the whole
# test job in about half the time an Intel Mac takes. The Intel Macs were
# the slowest leg of the run, and the one most often broken by what only
# they have (Homebrew's headers in /usr/local, a boot that takes minutes);
# nightly.yml still runs them every night. GitHub runs five Macs at a time
# for an account; nightly.yml takes the rest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request stops the run of the one before. A run on
# main always finishes, since main's caches are the ones every branch reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      os: '["ubuntu-26.04"]'

  firmware:
    name: Firmware
    uses: ./.github/workflows/firmware.yml
    with:
      os: '["ubuntu-26.04"]'

  test-quick:
    # The dev tree's build and its quick tests: all but the long ones, and
    # one boot for each area (the quick test preset), on the Mac as on
    # Linux; the rest of the boots are nightly.yml's.
    name: Build and quick tests (${{ matrix.os }})
    needs: firmware
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build cable
          machine: ${{ matrix.os }}
          tree: dev
          firmware: firmware-*
          compiler-cache: dev
      - run: uv run python tools/ci.py run test-quick

  qbox-build:
    name: QBox
    uses: ./.github/workflows/qbox-build.yml
    with:
      os: '["ubuntu-26.04"]'

  qbox-quick:
    # The quick preset's second opinion: the quick tests and one boot for
    # each area on QBox's CPU (docs/models/qbox-cpu.md), where a boot of
    # Linux takes seconds. Every boot on both harts is nightly.yml's.
    name: Quick tests with QBox's CPU (${{ matrix.os }})
    needs: [firmware, qbox-build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build cable qbox
          machine: ${{ matrix.os }}
          tree: qbox-dev
          firmware: firmware-*
          qbox: true
          compiler-cache: qbox-dev
      - run: uv run python tools/ci.py run qbox-quick

  ci-passed:
    # The one check main's ruleset requires, so that a pull request can
    # merge itself once it is green: it needs every other job here, and
    # stands for them all. It runs whatever they did, since a job whose
    # needs failed is skipped, and GitHub counts a required check that was
    # skipped as passed. Not !cancelled(): a run cancelled by hand would
    # skip it too, and merge what it never tested.
    name: CI passed
    if: always()
    needs: [checks, firmware, test-quick, qbox-build, qbox-quick]
    runs-on: ubuntu-26.04
    steps:
      - run: "true"
