name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.13"]
        include:
          # The oldest Python we support, and the newest. 3.14 changed how
          # CPython guards against stack overflow, which is what the
          # PythonExecutor exists to stay clear of.
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.14"
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v6
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/dev/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/**') }}
      - run: uv sync
      - run: uv run cmake --preset dev
      - run: uv run cmake --build --preset dev
      - run: uv run ctest --preset dev

  wheel:
    name: Wheel, installed with uv and pip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel
      - run: uv run --no-project python tools/check_wheel.py dist/*.whl
      - run: tools/test_wheel.sh uv dist/*.whl
      - run: tools/test_wheel.sh pip dist/*.whl

  devcontainer:
    name: Build and test (devcontainer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            devcontainer:
              - '.devcontainer/**'
      - name: Build the image and run the tests inside it
        if: steps.changed.outputs.devcontainer == 'true'
        run: |
          docker build -t socpuppet-dev .devcontainer
          docker run --rm -v "$PWD:/workspace" -w /workspace socpuppet-dev \
            bash -c "uv sync && uv run cmake --preset dev && uv run cmake --build --preset dev && uv run ctest --preset dev"
