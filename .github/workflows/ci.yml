name: CI

# The quick tier, on every push to main and every pull request: lint, the
# firmware, the quick tests on Linux, with one boot of each area on both
# harts, and on an Intel Mac without the boots, and clang-tidy, coverage
# and the sanitizers on Linux. It answers in about half an hour. The rest
# is nightly.yml's: every other boot, twister, QBox, the wheels and the
# devcontainer, on every machine CI has. On a developer's machine,
# `uv run python tools/ci.py` runs that, and `--quick` runs this.
#
# Every job here is a thin wrapper around tools/ci.py, which holds each
# job's steps: what is left is GitHub's plumbing, the checkout, then the
# setup every job takes from .github/actions/setup (the packages, the caches
# and the artifacts). A job's log opens with the command that runs the same
# job on a developer's machine. The jobs this tier shares with nightly.yml
# are in the workflows both call, firmware.yml, checks.yml and
# qbox-build.yml, each given the machines this tier runs it on.
# tests/tooling/test_ci_workflow.py keeps the workflows to the jobs
# tools/ci.py runs.
#
# Nothing waits for lint: a job waits only for a job whose output it reads.
#
# The one Mac here is an Intel Mac: the slowest machine CI has, so its leg
# sets the pace of the run, and the one most often broken by what only it
# has (Homebrew's headers in /usr/local). GitHub runs five Macs at a time
# for an account; nightly.yml takes the rest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request stops the run of the one before. A run on
# main always finishes, since main's caches are the ones every branch reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      os: '["ubuntu-26.04"]'

  firmware:
    name: Firmware
    uses: ./.github/workflows/firmware.yml
    with:
      os: '["ubuntu-26.04"]'

  test-quick:
    # The dev tree's build and its quick tests: all but the long ones, and
    # one boot for each area (the quick test preset). The Intel Mac leaves
    # the boots out (tools/ci.py); the rest of the boots are nightly.yml's.
    name: Build and quick tests (${{ matrix.os }})
    needs: firmware
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build cable
          machine: ${{ matrix.os }}
          tree: dev
          firmware: firmware-*
          compiler-cache: dev
      - run: uv run python tools/ci.py run test-quick

  qbox-build:
    name: QBox
    uses: ./.github/workflows/qbox-build.yml
    with:
      os: '["ubuntu-26.04"]'

  qbox-quick:
    # The quick preset's second opinion: the quick tests and one boot for
    # each area on QBox's CPU (docs/models/qbox-cpu.md), where a boot of
    # Linux takes seconds. Every boot on both harts is nightly.yml's.
    name: Quick tests with QBox's CPU (${{ matrix.os }})
    needs: [firmware, qbox-build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build cable qbox
          machine: ${{ matrix.os }}
          tree: qbox-dev
          firmware: firmware-*
          qbox: true
          compiler-cache: qbox-dev
      - run: uv run python tools/ci.py run qbox-quick
