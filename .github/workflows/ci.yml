name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Formatting and static checks on every file, with nothing to build
    # first. ctest runs the same thing; this job says so in seconds.
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python tools/lint.py

  test:
    name: Build and test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.13"]
        include:
          # The oldest Python we support, and the newest. 3.14 changed how
          # CPython guards against stack overflow, which is what the
          # PythonExecutor exists to stay clear of.
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.14"
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv sync
      - run: uv run cmake --preset dev
      - run: uv run cmake --build --preset dev
      - run: uv run ctest --preset dev

  tidy:
    # clang-tidy over our own C++, and each of our headers compiled on its
    # own. Nothing else is built: clang-tidy reads the sources and the
    # compile commands that configuring writes.
    #
    # Those are GCC's compile commands and GCC's standard library, so
    # clang-tidy reads our code the way the Linux build compiles it.
    name: clang-tidy and header check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-ubuntu-24.04-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv sync
      - run: uv run cmake --preset dev
      - run: uv run cmake --build --preset dev --target tidy
      - run: uv run cmake --build --preset dev --target check_headers

  iss-spike:
    # Milestone M1's exit test: each CPU model candidate that builds in this
    # tree runs a smoke program and boots Zephyr's hello_world behind the
    # draft CPU slot. See docs/iss-spike.md. QBox is built on its own, with
    # its own build system, and is not run here.
    name: ISS spike
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v7
      - name: Cache the firmware
        id: firmware
        uses: actions/cache@v6
        with:
          path: |
            build/firmware/*.bin
            build/firmware/*.elf
            build/firmware/*.opcodes.txt
          key: firmware-${{ hashFiles('spikes/iss/firmware/**') }}
      - name: Build the firmware
        if: steps.firmware.outputs.cache-hit != 'true'
        run: spikes/iss/firmware/build.sh
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-spike-ubuntu-24.04-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**', 'spikes/iss/CMakeLists.txt', 'spikes/iss/boost_libraries.cmake', 'spikes/iss/patches/**') }}
      - run: uv sync
      - run: uv run cmake --preset spike
      # Some of the candidates' sources take over a gigabyte each to compile.
      - run: uv run cmake --build --preset spike --parallel 4
      - run: uv run ctest --preset spike --verbose
        env:
          # A missing firmware image fails the boot tests instead of
          # skipping them.
          SPIKE_REQUIRE_FIRMWARE: "1"

  coverage:
    # Which lines of our own C++ and Python the tests run. The job fails if
    # either falls below its floor (CMakePresets.json).
    name: Test coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-ubuntu-24.04-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv sync
      - run: uv run cmake --preset coverage
      - run: uv run cmake --build --preset coverage --target coverage
      - name: Show the figures on the job's page
        if: always()
        run: |
          {
            cat build/dev/coverage/cpp.md
            echo
            echo "# Python coverage"
            echo
            uv run python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the line-by-line reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/dev/coverage

  sanitizers:
    # The C++ tests again, built so that a memory error or undefined
    # behavior stops the program instead of passing unnoticed.
    name: C++ tests under sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev device-tree-compiler
      - uses: astral-sh/setup-uv@v7
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-ubuntu-24.04-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - run: uv sync
      - run: uv run cmake --preset asan
      - run: uv run cmake --build --preset asan
      - run: uv run ctest --preset asan

  wheel:
    # The wheels a user will install, built by cibuildwheel as configured in
    # pyproject.toml: one per Python version, for Linux on Intel and Arm
    # (manylinux) and for macOS on Apple silicon. cibuildwheel installs each
    # into a fresh environment and runs the Python tests against it.
    # Nothing is published from here.
    name: Portable wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: pypa/cibuildwheel@v4.2.1
      - name: Check what each wheel holds
        run: |
          for wheel in wheelhouse/*.whl; do
            uv run --no-project python tools/check_wheel.py "$wheel"
          done
      # cibuildwheel installed the wheels with pip, inside its own
      # environments. Install one the way a user would, with uv and with
      # pip, on this machine.
      - run: tools/test_wheel.sh uv wheelhouse/*-cp313-*.whl
      - run: tools/test_wheel.sh pip wheelhouse/*-cp313-*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  devcontainer:
    name: Build and test (devcontainer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            devcontainer:
              - '.devcontainer/**'
      - name: Build the image and run the tests inside it
        if: steps.changed.outputs.devcontainer == 'true'
        run: |
          docker build -t socpuppet-dev .devcontainer
          # The checkout belongs to the runner's user and the container runs
          # as root, so git has to be told the mounted directory is safe to
          # read. The lint test lists files with git.
          docker run --rm -v "$PWD:/workspace" -w /workspace socpuppet-dev \
            bash -c "git config --global --add safe.directory /workspace && uv sync && uv run cmake --preset dev && uv run cmake --build --preset dev && uv run ctest --preset dev"
