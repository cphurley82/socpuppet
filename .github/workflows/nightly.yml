name: Nightly

# Every night, every job of the nightly tier, on every machine CI has: the
# whole suite, every boot of firmware, which the quick tier (ci.yml) runs
# one of for each area to answer a push in half an hour. Each job is a
# thin wrapper around tools/ci.py, which holds its steps, and its log opens
# with the command that runs it on a developer's machine;
# `uv run python tools/ci.py` runs every job of this tier that can run
# there. The jobs this tier shares with ci.yml are in the workflows both
# call, firmware.yml, checks.yml and qbox-build.yml, each given the machines
# this tier runs it on, and every job takes its setup from
# .github/actions/setup. tests/tooling/test_ci_workflow.py keeps the
# workflows to the jobs tools/ci.py runs.
#
# Nothing waits for lint: a job waits only for a job whose output it reads.
#
# The Macs are Apple silicon (macos-15, macos-26 and macos-latest, whichever
# that is) and Intel (macos-26-intel and macos-15-intel). An Intel Mac runs
# here what it runs natively, as tools/ci.py runs it there; what it builds
# in the devcontainer's image, the firmware and twister, it does not, as
# GitHub's Macs have no Docker. macos-26-intel runs test, qbox-build, qbox
# and wheel; macos-15-intel, an older Xcode and SDK, and macos-latest run
# only test.
#
# The clang-tidy jobs run on one Linux and one Mac, the newest, macos-26,
# where qbox-build builds QBox for qbox-tidy. That is enough: clang-tidy
# reads the compile commands, and an Intel Mac's are an Apple silicon
# one's; the Intel Mac's builds already meet Homebrew's /usr/local; and
# qbox-tidy on one ran for 50 minutes and then lost its runner, most likely
# to a lack of memory. On a developer's machine, tools/ci.py runs both,
# whatever the machine.

on:
  # 05:23 UTC, the evening in California: GitHub has started the scheduled
  # runs hours late, and the run is to be done by morning. Off the hour,
  # when GitHub's schedules are busiest.
  schedule:
    - cron: "23 5 * * *"
  # And by hand: `gh workflow run nightly.yml`, with `--ref BRANCH` for a
  # branch's whole suite before it merges.
  workflow_dispatch:

# One run at a time for each branch, and none cancelled while it runs: a
# run by hand on main waits for the night's. A run waiting is replaced by a
# newer one.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      os: '["ubuntu-26.04", "macos-26"]'

  firmware:
    name: Firmware
    uses: ./.github/workflows/firmware.yml
    with:
      # And the Apple silicon Mac twister runs on.
      os: '["ubuntu-26.04", "macos-15"]'

  test:
    name: Build and test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: firmware
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 too, the oldest we support, with its older GCC (13)
        # and system libraries; and macos-latest, whichever macOS GitHub
        # moves it to, so that a new one is met here before a user does.
        os: [ubuntu-26.04, ubuntu-24.04, macos-15, macos-latest, macos-26-intel, macos-15-intel]
        # The Python the tools are pinned to (.python-version). The oldest
        # and the newest we support are tested by the wheel job, which
        # builds a wheel for each and runs the Python tests against it.
        # That matters for 3.14, which changed how CPython guards against
        # stack overflow: the PythonExecutor exists to stay clear of that.
        python: ["3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build cable
          machine: ${{ matrix.os }}
          tree: dev
          firmware: firmware-*
      - run: uv run python tools/ci.py run test

  twister:
    # Zephyr's own test suites, and ours, run on every board by twister,
    # Zephyr's test runner, with socpuppet as the emulator: the
    # board-compliance run (docs/twister.md). Twister builds an image and
    # runs it in one breath, so this one job has both what builds firmware
    # and what runs it: Zephyr, its SDK and its venv, from their caches.
    #
    # On Linux and on a Mac. The Mac's runner is Apple silicon, the one Mac
    # the Zephyr SDK has a toolchain for, and so the one place twister runs
    # on macOS itself: an Intel Mac runs it in the devcontainer's image,
    # and so not here.
    name: Twister (Zephyr's tests on the boards, ${{ matrix.os }})
    needs: firmware
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      # The boot ROMs, which every run starts in.
      - uses: ./.github/actions/setup
        with:
          packages: build
          machine: ${{ matrix.os }}
          tree: dev
          firmware: firmware-rom
          zephyr: true
      - run: uv run python tools/ci.py run twister
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: twister-${{ matrix.os }}
          # The verdicts, twister's own account of each run, and each
          # scenario's build log, its console, and what the emulator said
          # of how the run ended.
          path: |
            build/twister/out/*/twister.json
            build/twister/out/*/twister*.xml
            build/twister/out/*/twister.log
            build/twister/out/**/build.log
            build/twister/out/**/handler.log
            build/twister/out/**/handler_stderr.log

  qbox-build:
    name: QBox
    uses: ./.github/workflows/qbox-build.yml
    with:
      # Ubuntu 24.04 too, the oldest we support: QBox links more of the
      # system's libraries than anything else, and they differ most there.
      # And macos-26, which builds it for qbox-tidy.
      os: '["ubuntu-26.04", "ubuntu-24.04", "macos-15", "macos-26", "macos-26-intel"]'

  qbox-tidy:
    # clang-tidy over the adapter of QBox's CPU, which the tidy job's tree
    # leaves out.
    name: clang-tidy and header check with QBox (${{ matrix.os }})
    needs: qbox-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build qbox
          machine: ${{ matrix.os }}
          tree: qbox-dev
          qbox: true
      - run: uv run python tools/ci.py run qbox-tidy

  qbox:
    # The qbox_cpu, QEMU's RISC-V CPU inside SystemC, as a second hart
    # beside DBT-RISE's (docs/models/qbox-cpu.md): the bus-master contract,
    # the hart's suite with QBox's fates skipped, the Python boots of the
    # host, and twister's suites on the host board.
    #
    # On Linux, and on a Mac natively, with Homebrew's packages
    # (docs/setup.md): nothing but this leg would say that the patches
    # QBox needs on a Mac (docs/upstream.md) had stopped working there.
    # An Intel Mac stops before twister, which it runs in the
    # devcontainer's image, and so needs neither Zephyr nor its SDK.
    name: Build and test with QBox's CPU (${{ matrix.os }})
    needs: [firmware, qbox-build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 too, as qbox-build is.
        os: [ubuntu-26.04, ubuntu-24.04, macos-15, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build cable edk2 qbox
          machine: ${{ matrix.os }}
          tree: qbox-dev
          firmware: firmware-*
          qbox: true
          zephyr: ${{ !endsWith(matrix.os, '-intel') }}
      - run: uv run python tools/ci.py run qbox
      - uses: actions/upload-artifact@v7
        if: ${{ always() && !endsWith(matrix.os, '-intel') }}
        with:
          name: twister-qbox-${{ matrix.os }}
          path: |
            build/twister/out/*/twister.json
            build/twister/out/*/twister*.xml
            build/twister/out/*/twister.log
            build/twister/out/**/build.log
            build/twister/out/**/handler.log
            build/twister/out/**/handler_stderr.log

  pciem-guest:
    # 🐧 A real host's tests. The runner's Linux cannot load pciem, which
    # needs memory set aside at boot, so the tests run as root in a QEMU
    # guest of the runner's own kernel, with the runner's root as its own
    # (tools/pciem_guest.py), on KVM.
    name: A real host, in a QEMU guest
    needs: firmware
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build guest
          machine: ubuntu-26.04
          tree: pciem-dev
          firmware: firmware-zephyr
      # QEMU boots the runner's own kernel, which only root can read, and
      # runs it on KVM, which is the kvm group's.
      - name: Let QEMU read the kernel and use KVM
        run: |
          sudo chmod a+r "/boot/vmlinuz-$(uname -r)"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-for-all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: uv run python tools/ci.py run pciem-guest

  wheel:
    # The wheels a user will install, built by cibuildwheel as configured in
    # pyproject.toml: one per Python version, for Linux on Intel and Arm
    # (manylinux) and for macOS on Apple silicon and on Intel. cibuildwheel
    # installs each into a fresh environment and runs the Python tests
    # against it, and then one is installed the way a user would, with uv
    # and with pip, and boots real firmware. Nothing is published from here.
    #
    # Nearly all of a wheel is the dependencies, which are the same for
    # every Python version. A compiler cache (ccache, set up in
    # pyproject.toml) lets the second and third wheel take them from the
    # first, and keeping the cache from one run to the next lets the first
    # take them from last time. On Linux the build runs in a container,
    # which sees the runner's files under /host.
    name: Portable wheels (${{ matrix.os }})
    needs: firmware
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-15, macos-26-intel]
    env:
      CCACHE_DIR: ${{ startsWith(matrix.os, 'ubuntu') && '/host/home/runner/.cache/ccache' || '/Users/runner/Library/Caches/ccache' }}
      CCACHE_COMPRESS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Cache compiled dependencies
        uses: actions/cache@v6
        with:
          path: ${{ startsWith(matrix.os, 'ubuntu') && '/home/runner/.cache/ccache' || '/Users/runner/Library/Caches/ccache' }}
          # Saved once for each set of dependencies. Our own few files are
          # compiled every time, which is what a change to them needs.
          key: ccache-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**', 'pyproject.toml') }}
      # dtc compiles the devicetree a boot under OpenSBI is handed.
      - uses: ./.github/actions/setup
        with:
          packages: build
          firmware: firmware-*
      - run: uv run python tools/ci.py run wheel
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: build/wheelhouse/*.whl

  devcontainer-26-04:
    # The tests, built in the devcontainer's image on Ubuntu 26.04: Linux with
    # its own GCC, as a contributor's editor or tools/devcontainer.py
    # --ubuntu 26.04 builds it, from the Dockerfile as it is tonight.
    name: Build and test (devcontainer, Ubuntu 26.04)
    needs: firmware
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          firmware: firmware-*
      - run: uv run python tools/ci.py run devcontainer-26-04

  devcontainer-24-04:
    # The tests, built in the devcontainer's image on Ubuntu 24.04: Linux with
    # its own GCC, as a contributor's editor or tools/devcontainer.py
    # --ubuntu 24.04 builds it, from the Dockerfile as it is tonight.
    name: Build and test (devcontainer, Ubuntu 24.04)
    needs: firmware
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          firmware: firmware-*
      - run: uv run python tools/ci.py run devcontainer-24-04
