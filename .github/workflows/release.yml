name: Release

# A release of socpuppet, made by pushing its tag: `v` and the version in
# pyproject.toml, annotated with the release's notes, on a commit of main
# (docs/development.md). Each job is a thin wrapper around tools/ci.py, as
# in the other tiers.

on:
  push:
    tags: ["v*"]

# One run for each tag, and none cancelled while it runs: half a release
# is worse than a release made twice, which publishes nothing twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    # The tag is the version's, annotated, and on main; PyPI has no such
    # version yet; the images an installed wheel fetches are published.
    # Then the source distribution, built once.
    name: Check the release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # main and the tags, to find the tag's commit on main.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: uv run python tools/ci.py run release-check
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: build/sdist/*.tar.gz

  wheel:
    name: Wheels
    # Every wheel the nightly tier builds, built and tested the same way
    # (wheel.yml), once the release is known to be one.
    needs: release-check
    uses: ./.github/workflows/wheel.yml
    with:
      os: '["ubuntu-26.04", "ubuntu-26.04-arm", "macos-latest", "macos-26-intel"]'

  pypi:
    # The wheels and the source, to PyPI, by its trusted publishing: PyPI
    # trusts a token GitHub gives this job alone, in the pypi environment,
    # whose rules may ask a person to approve it first. Nothing is uploaded
    # twice: a run made again skips what PyPI has.
    name: Publish to PyPI
    needs: [release-check, wheel]
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/socpuppet
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          distributions: true
      - run: uv run python tools/ci.py run pypi

  github-release:
    # The tag's GitHub release, its notes the tag's message and its files
    # the same wheels and source: the project's latest, or a pre-release
    # for a release candidate. It says a version is out, so it waits until
    # the version installs from PyPI on every machine.
    name: The GitHub release
    needs: [release-check, wheel, installed]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The tag as it was pushed, with its message: one commit deep,
          # it is fetched without one, and the notes would be the commit's.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          distributions: true
      - run: uv run python tools/ci.py run github-release
        env:
          GH_TOKEN: ${{ github.token }}

  installed:
    # The release gate's test: on each machine a wheel is built for, a
    # clean venv installs the release as PyPI serves it, with uv and with
    # pip, and the Python tests run on it, the README's first show among
    # them, with the firmware fetched from the images' release.
    name: Installed from PyPI (${{ matrix.os }})
    needs: pypi
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      # dtc compiles the devicetree a boot under OpenSBI is handed.
      - uses: ./.github/actions/setup
        with:
          packages: build
      - run: uv run python tools/ci.py run installed

  tap:
    # Homebrew's formula of the release, installed from a tap of its own
    # and tested, on a Mac of each processor, before the tap is touched:
    # each Mac installs its own processor's wheel from the GitHub release.
    name: Homebrew's formula (${{ matrix.os }})
    needs: [wheel, github-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          distributions: true
      - run: uv run python tools/ci.py run tap

  tap-push:
    # The formula, committed to the tap, homebrew-socpuppet under the same
    # account, with a token that may write to it alone: the repository's
    # secret TAP_TOKEN. A release candidate leaves the tap alone.
    name: Push to the tap
    needs: [wheel, github-release, tap]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          distributions: true
      - run: uv run python tools/ci.py run tap-push
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}

  tap-installed:
    # The release gate's test on a Mac: `brew install` from the tap, as a
    # user would, then the front door on the Python it went into.
    name: Installed from the tap (${{ matrix.os }})
    needs: tap-push
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: uv run python tools/ci.py run tap-installed
