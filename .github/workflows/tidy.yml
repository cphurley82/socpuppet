name: Tidy

# clang-tidy and the header check over the qbox tree, after QBox's build.
# ci.yml and nightly.yml each call this, with `needs: qbox-build`, so the
# job is written once and comes after the build in both tiers. It is not a
# job of qbox-build.yml: a job that needs a called workflow waits for the
# whole of it, and the jobs on QBox's CPU (qbox-quick, qbox) need QBox's
# build, not clang-tidy's verdict.

on:
  workflow_call:
    inputs:
      os:
        description: >-
          The machines clang-tidy runs on, as a JSON list: each is one QBox
          is built for.
        type: string
        required: true

jobs:
  tidy:
    # clang-tidy over our own C++, and each of our headers compiled on its
    # own, over the qbox tree: the dev tree and QBox's adapter, which the
    # dev tree leaves out. Nothing else is built: clang-tidy reads the
    # sources and the compile commands that configuring writes, which are
    # GCC's on Linux and Apple clang's on a Mac, each with its own standard
    # library, so a system's leg checks our code the way that system
    # compiles it. Here it takes QBox's build, on every machine, and in CI
    # tools/ci.py runs it over the qbox tree whatever it finds: a QBox
    # missing is a fault, which configuring that tree reports. It falls
    # back to the dev tree only on a developer's machine without QBox.
    name: clang-tidy and header check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages: build qbox
          machine: ${{ matrix.os }}
          tree: qbox-dev
          qbox: true
      - run: uv run python tools/ci.py run tidy
