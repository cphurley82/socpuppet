# Keeps the pinned tools from going stale. One pull request a week per
# ecosystem, with every update in it, and CI says whether it is safe to merge:
# its quick tier on the pull request, and the nightly tier on main the night
# after, or on the branch by hand (gh workflow run nightly.yml --ref BRANCH).
version: 2
updates:
  # The actions CI's workflows use, and its setup action.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The developer tools in uv.lock: cmake, the linters, pytest.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      tools:
        patterns: ["*"]
    # PyFilesystem2, under pyfatfs, still imports pkg_resources, which
    # setuptools 81 removed, so the cap stays (docs/upstream.md).
    ignore:
      - dependency-name: setuptools
        versions: [">=81"]
