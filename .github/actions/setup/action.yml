name: Set up a job
description: >-
  What a job of CI's needs before it runs tools/ci.py: uv, the system's
  packages, and what earlier jobs and runs kept for it. Every job of the
  workflows takes its setup from here, after its checkout, so that each
  piece of it is written once. What a build keeps for the next run, its
  fetched dependencies and its compiler cache, is saved by main's runs
  alone, and a branch's run reads main's: GitHub keeps 10 GB of caches for
  a repository, and each pull request saving its own copies took half.

inputs:
  packages:
    description: >-
      The sets of the system's packages the job needs, by name, separated
      by spaces: build, cable, edk2, linux, qbox and guest (below).
    default: ""
  machine:
    description: >-
      The runner the job runs on, as its runs-on names it: the caches and
      QBox's build are kept for each machine.
    default: ""
  tree:
    description: >-
      The build tree under build/ whose fetched dependencies are restored
      and kept: dev, qbox-dev or pciem-dev.
    default: ""
  compiler-cache:
    description: >-
      The name of the compiler cache (ccache) the job's build compiles
      through, one for each set of flags: dev, coverage, asan, qbox-dev.
    default: ""
  firmware:
    description: >-
      The firmware jobs' artifacts to take, by name or by a pattern:
      firmware-* for all of them.
    default: ""
  qbox:
    description: Take QBox from qbox-build.
    default: "false"
  zephyr:
    description: Restore Zephyr, its venv and the Zephyr SDK, for twister.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install the system's packages
      if: inputs.packages != '' || inputs.compiler-cache != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        COMPILER_CACHE: ${{ inputs.compiler-cache }}
      # Each set, for Ubuntu and for a Mac.
      run: |
        ubuntu=()
        mac=()
        if [[ -n $COMPILER_CACHE ]]; then
          ubuntu+=(ccache)
          mac+=(ccache)
        fi
        for set in $PACKAGES; do
          case $set in
            # socpuppet's build. zlib is for SCC's trace writer, and dtc
            # checks the devicetrees the boards generate and compiles the
            # one a boot under OpenSBI is handed; without it those tests
            # skip.
            build)
              ubuntu+=(zlib1g-dev device-tree-compiler)
              mac+=(dtc)
              ;;
            # libslirp, the cable to this machine's network that ssh to
            # Linux goes over (test_ssh_over_the_cable.py).
            cable)
              ubuntu+=(libslirp-dev)
              mac+=(libslirp)
              ;;
            # EDK2's BaseTools are built with the runner's own gcc, and want
            # libuuid's header; and EDK2 compiles ACPI tables with iasl.
            edk2)
              ubuntu+=(uuid-dev acpica-tools)
              mac+=(acpica)
              ;;
            # The kernel's build generates its parsers with flex and bison
            # and does its arithmetic with bc; its host tools are built with
            # the runner's own gcc; and its root filesystem is made by
            # mkfs.ext4.
            linux)
              ubuntu+=(flex bison bc e2fsprogs)
              ;;
            # QBox's: on Ubuntu as the devcontainer's image has them
            # (.devcontainer/Dockerfile), on a Mac as docs/setup.md lists
            # them.
            qbox)
              ubuntu+=(
                bison flex libasio-dev libelf-dev libepoxy-dev libglib2.0-dev
                libjpeg-turbo8-dev libpixman-1-dev libsdl2-dev libslirp-dev
                libvirglrenderer-dev libzip-dev lld llvm meson ninja-build
                ocl-icd-opencl-dev pkg-config python3-dev python3-pip
                python3-venv
              )
              mac+=(
                asio glib jpeg-turbo libelf libslirp libzip meson ninja pixman
                pkgconf sdl2
              )
              ;;
            # 🐧 A real host in a QEMU guest of the runner's own kernel,
            # with the headers pciem is built against.
            guest)
              ubuntu+=(qemu-system-x86 busybox-static zstd "linux-headers-$(uname -r)")
              ;;
            *)
              echo "::error::There is no set of packages named $set."
              exit 1
              ;;
          esac
        done
        if [[ $RUNNER_OS == Linux && ${#ubuntu[@]} -gt 0 ]]; then
          sudo apt-get update
          sudo apt-get install -y "${ubuntu[@]}"
        elif [[ ${#mac[@]} -gt 0 ]]; then
          brew install "${mac[@]}"
        fi
    - uses: astral-sh/setup-uv@v7
    # What FetchContent fetched, for configuring without the network's
    # minutes. Not what it built there: the build tree is new, so ninja has
    # no record of it and builds it again, and the compiler cache is what
    # saves that.
    - name: Cache fetched dependencies
      if: inputs.tree != '' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: |
          build/${{ inputs.tree }}/_deps
          !build/${{ inputs.tree }}/_deps/*-build
        key: deps-${{ inputs.tree }}-${{ inputs.machine }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
    - name: Restore fetched dependencies
      if: inputs.tree != '' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: |
          build/${{ inputs.tree }}/_deps
          !build/${{ inputs.tree }}/_deps/*-build
        key: deps-${{ inputs.tree }}-${{ inputs.machine }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
    # Each configure here is a first, and CMake takes the compiler launcher
    # from the environment then. The cache is kept for a week and for a set
    # of dependencies: most of a build is them, and a week's changes to our
    # own files are few.
    - name: Compile through ccache
      if: inputs.compiler-cache != ''
      shell: bash
      run: |
        {
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/build/ccache"
          echo "CCACHE_MAXSIZE=500M"
          echo "CCACHE_WEEK=$(date -u +%G-%V)"
        } >> "$GITHUB_ENV"
    - name: Cache what was compiled
      if: inputs.compiler-cache != '' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: build/ccache
        key: ccache-${{ inputs.compiler-cache }}-${{ inputs.machine }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}-${{ env.CCACHE_WEEK }}
        restore-keys: ccache-${{ inputs.compiler-cache }}-${{ inputs.machine }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}-
    - name: Restore what was compiled
      if: inputs.compiler-cache != '' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: build/ccache
        key: ccache-${{ inputs.compiler-cache }}-${{ inputs.machine }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}-${{ env.CCACHE_WEEK }}
        restore-keys: ccache-${{ inputs.compiler-cache }}-${{ inputs.machine }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}-
    - name: Restore the Zephyr SDK
      if: inputs.zephyr == 'true'
      uses: actions/cache/restore@v6
      with:
        path: build/firmware/*/zephyr-sdk-*
        key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml') }}
        fail-on-cache-miss: true
    - name: Restore Zephyr and its venv
      if: inputs.zephyr == 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          build/firmware/.west
          build/firmware/*/python
          build/firmware/*/venv
          build/firmware/zephyr
        key: zephyr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/versions.toml', 'firmware/twister-requirements.txt') }}
        fail-on-cache-miss: true
    - name: Take QBox from qbox-build
      if: inputs.qbox == 'true'
      uses: actions/download-artifact@v8
      with:
        name: qbox-${{ inputs.machine }}
    - name: Unpack QBox
      if: inputs.qbox == 'true'
      shell: bash
      run: tar -xzf qbox-install.tar.gz
    - name: Take the firmware the firmware jobs built
      if: inputs.firmware != ''
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ inputs.firmware }}
        merge-multiple: true
        path: build/firmware
