# Lint rules for the Markdown. Run them with tools/lint.py.

[global]
disable = [
    # Line length. A paragraph is one line here, however long, and the editor
    # wraps it for display. Hard-wrapped prose makes for noisy diffs.
    "MD013",
]

[per-file-ignores]
# CLAUDE.md is a one-line include of AGENTS.md, so it has no heading.
"CLAUDE.md" = ["MD041"]
