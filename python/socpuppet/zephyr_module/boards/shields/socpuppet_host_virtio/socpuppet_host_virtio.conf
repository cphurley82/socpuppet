# The virtio devices are behind the virtio-mmio transport, which is a
# driver of its own that the devices' drivers sit on.
CONFIG_VIRTIO=y
# The transport puts each virtqueue on the heap (k_aligned_alloc) and
# selects no heap of its own, so an image without one fails at the link
# (docs/upstream.md). A queue of the 256 entries the devices allow is
# about 7 KiB, and a device has up to two.
CONFIG_HEAP_MEM_POOL_SIZE=131072
