# The drive is on a PCIe link, and nothing has set the link up before
# Zephyr starts: Zephyr scans the bus and places the drive itself.
CONFIG_PCIE=y
CONFIG_PCIE_CONTROLLER=y
# The drive interrupts with messages.
CONFIG_PCIE_MSI=y
# The drive is an NVMe drive. The driver asks for the kind of message it
# needs (MSI-X, with a vector for each queue) by itself.
CONFIG_NVME=y
