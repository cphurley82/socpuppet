# Zephyr's SiFive SPI driver has no asynchronous transfer, which the
# loopback test turns on (docs/upstream.md).
CONFIG_SPI_ASYNC=n
# How many times the ideal a timed transfer may take. A simulated CPU runs a
# quantum ahead of the clock and sees the FIFOs' progress only at the
# quantum's end, so at the bus's fastest a short transfer takes about forty
# times the ideal, where a CPU on silicon keeps up.
CONFIG_SPI_IDEAL_TRANSFER_DURATION_SCALING=64
# Both are the loopback test's own: the shield is for that test alone.
