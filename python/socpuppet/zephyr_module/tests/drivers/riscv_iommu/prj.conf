CONFIG_ZTEST=y
# Zephyr's NVMe driver is a disk driver, and is only built when disks are
# asked for. The shields switch on the rest.
CONFIG_DISK_ACCESS=y
# The drive goes through page tables: every page of the RAM and the
# IMSIC's mapped to itself, so the tests can take one away.
CONFIG_SOCPUPPET_RISCV_IOMMU_IDENTITY_PAGE_TABLE=y
