# The watchdog is SiFive's, which Zephyr has a driver for.
CONFIG_WATCHDOG=y
# The system controller is read through Zephyr's driver for any block of
# registers that other code reaches into.
CONFIG_SYSCON=y
# sys_reboot(), which socpuppet's SoC turns into a write to the system
# controller.
CONFIG_REBOOT=y
