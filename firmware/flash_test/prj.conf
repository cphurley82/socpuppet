# What Zephyr's test asks for (its own prj.conf).
CONFIG_TEST=y
CONFIG_ZTEST=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MAIN_STACK_SIZE=2048

# What a NAND needs of it. A NAND is written a whole page at a time, and
# the test writes in pieces of this size, from buffers on its stack.
CONFIG_FLASH_FILL_BUFFER_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=32768

# The size the test expects the driver to report: the NAND of the SSD that
# socpuppet.boards.ssd describes when it is not told a size, 2 MiB.
CONFIG_TEST_DRIVER_FLASH_SIZE=2097152
