# The NAND is reached through Zephyr's flash API, by the driver for the
# SSD's flash controller in socpuppet's Zephyr module. The drivers for the
# NVMe frontend and the DMA engine need nothing asked of them: they are
# built because the board has the devices.
CONFIG_FLASH=y

# A driver that cannot start says why in Zephyr's log, and the firmware
# has no drive without its drivers. The minimal log is a line on the
# console as it happens, marked "E:" for an error.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
