# This is the top of the project: look no further up for more of these.
set noparent

# We do not put a copyright line in each file. The LICENSE file covers the
# whole repository.
filter=-legal/copyright

# Indentation is clang-format's job. cpplint does not know C++20 concepts and
# takes the continuation lines of one for code indented inside a namespace.
filter=-whitespace/indent_namespace

# A header guard spells the header's path from src/, which is also how the
# header is included: src/socpuppet/core/time.h is SOCPUPPET_CORE_TIME_H_.
root=src

# Only the C standard library's headers count as "C system headers". Left to
# itself cpplint puts every <angle-bracket> header ending in .h there, and
# <systemc> and <tlm> too, and then wants them above the C++ standard
# library. This setting agrees with the include order in .clang-format.
includeorder=standardcfirst
