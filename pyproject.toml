[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "socpuppet"
version = "0.0.1"
description = "A whole SoC simulated in SystemC, with Python pulling the strings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"

[project.scripts]
socpuppet = "socpuppet.cli:main"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "clang-format==23.1.2",
    "clang-tidy==22.1.8",
    "cmake>=3.28",
    "coverage>=7.10",
    "cpplint>=2.0.2",
    "gcovr>=8.6",
    "mypy>=1.18",
    "ninja>=1.11",
    "pytest>=9",
    "ruff>=0.16",
    "rumdl==0.2.78",
    "shellcheck-py>=0.11.0.1",
]

[tool.uv]
# The dev loop builds with CMake directly (see CMakePresets.json), so
# `uv sync` only installs tools and never builds the project itself.
package = false

[tool.scikit-build]
# This is the packaging path (`uv build`, `pip install .`). It builds the
# extension without the C++ tests and installs it into the wheel.
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
wheel.packages = ["python/socpuppet"]
# Keep the build tree between runs so SystemC and SCC are not rebuilt.
build-dir = "build/wheel-{wheel_tag}"

[tool.scikit-build.cmake.define]
SOCPUPPET_BUILD_TESTS = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# The dev build drops the native extension into python/socpuppet/, so the
# package is importable straight from the source tree.
pythonpath = ["python"]
