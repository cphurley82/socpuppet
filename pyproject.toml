[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "socpuppet"
version = "0.0.1"
description = "A whole SoC simulated in SystemC, with Python pulling the strings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
authors = [{ name = "Chris Hurley" }]
keywords = ["systemc", "tlm", "virtual platform", "risc-v", "simulation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Emulators",
]

[project.urls]
Repository = "https://github.com/cphurley82/socpuppet"
Documentation = "https://github.com/cphurley82/socpuppet/tree/main/docs"
Issues = "https://github.com/cphurley82/socpuppet/issues"

[project.scripts]
socpuppet = "socpuppet.cli:main"

# pytest loads the plugin by itself wherever socpuppet is installed. The
# entry is named after the module so that a conftest.py which also names the
# module in `pytest_plugins` does not load it a second time.
[project.entry-points.pytest11]
"socpuppet.pytest_plugin" = "socpuppet.pytest_plugin"

[dependency-groups]
# What the NPU spike's numpy flavour needs (spikes/npu). Not a dependency
# of socpuppet.
spike = ["numpy>=2.3"]
dev = [
    "actionlint-py>=1.7.12.25",
    "cibuildwheel>=4.3",
    "clang-format==23.1.3",
    "clang-tidy==22.1.8",
    "cmake>=3.28",
    "coverage>=7.10",
    "cpplint>=2.0.2",
    "dpkt>=1.9",
    "gcovr>=8.6",
    "jsonschema>=4.26.0",
    "mypy>=1.18",
    "ninja>=1.11",
    # Makes the FAT disk images the virtio disk is booted with, and
    # reads back what firmware wrote to them.
    "pyfatfs>=1.1",
    "pytest>=9",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16",
    "rumdl==0.2.79",
    # pyfatfs is built on PyFilesystem2, which still imports
    # pkg_resources, and setuptools 81 has none (docs/upstream.md).
    "setuptools<81",
    "shellcheck-py>=0.11.0.1",
    "systemrdl-compiler>=1.33.0",
]

[tool.uv]
# The dev loop builds with CMake directly (see CMakePresets.json), so
# `uv sync` only installs tools and never builds the project itself.
package = false

[tool.scikit-build]
# This is the packaging path (`uv build`, `pip install .`). It builds the
# extension without the C++ tests and installs it into the wheel.
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
wheel.packages = ["python/socpuppet"]
# What a source distribution leaves behind: build trees, the write-ups,
# and experiments that nothing in the package depends on.
sdist.exclude = ["build", "dist", "docs", "spikes", "wheelhouse"]
# One build tree, whichever Python the wheel is for. It is not what saves
# compiling SystemC and the rest again: scikit-build-core starts every
# isolated build with a fresh CMake cache, the dependencies are unpacked
# anew, and everything is rebuilt. What saves it is a compiler cache
# (ccache, as CI's wheel job has), and that needs each file to be compiled
# by the same command from one wheel to the next, which one tree gives.
build-dir = "build/wheel"

[tool.scikit-build.cmake.define]
SOCPUPPET_BUILD_TESTS = false

[tool.cibuildwheel]
# The portable wheels, one per Python version and platform: what
# `uv add socpuppet` will fetch once they are published. CI builds them
# (see .github/workflows/ci.yml). Each is installed into a fresh environment
# and tested there, away from the source tree.
build = ["cp312-*", "cp313-*", "cp314-*"]
# manylinux covers the glibc distributions. musl (Alpine) is not built yet.
skip = ["*-musllinux_*"]
test-sources = ["tests/python"]
# The tests' own libraries too: the FAT images and Ethernet frames the
# virtio tests make (pyfatfs needs setuptools<81, docs/upstream.md).
test-requires = [
    "pytest",
    "pytest-xdist",
    "dpkt>=1.9",
    "pyfatfs>=1.1",
    "setuptools<81",
]
# On every core, as ctest runs them (tests/python/CMakeLists.txt says why).
test-command = "pytest -n auto --dist loadscope --no-loadscope-reorder tests/python"

[tool.cibuildwheel.linux]
# SCC's trace writer needs zlib's headers. The library itself is part of
# the manylinux baseline, so the wheel may depend on it.
#
# ccache is what lets the second and third wheel reuse what the first
# compiled: nearly everything in a wheel is SystemC, SCC, Boost and the
# CPU, which do not care which Python it is for. It comes from EPEL, the
# extra packages for the manylinux image's distribution.
before-all = "dnf install -y zlib-devel epel-release && dnf install -y ccache"
# Where ccache keeps its cache, and how, which the container is told by
# whatever runs cibuildwheel: CI's wheel job, or tools/ci.py here. A
# variable that is not set is not passed.
environment-pass = ["CCACHE_DIR", "CCACHE_COMPRESS", "CCACHE_UMASK"]

[tool.cibuildwheel.linux.environment]
CMAKE_C_COMPILER_LAUNCHER = "ccache"
CMAKE_CXX_COMPILER_LAUNCHER = "ccache"

[tool.cibuildwheel.macos]
before-all = "HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache"

[tool.cibuildwheel.macos.environment]
# The oldest macOS the wheel runs on. C++20's std::format for floating-point
# numbers, which the code uses, arrived in the system's C++ library with 13.3.
MACOSX_DEPLOYMENT_TARGET = "13.3"
CMAKE_C_COMPILER_LAUNCHER = "ccache"
CMAKE_CXX_COMPILER_LAUNCHER = "ccache"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# The dev build drops the native extension into python/socpuppet/, so the
# package is importable straight from the source tree.
pythonpath = ["python"]
