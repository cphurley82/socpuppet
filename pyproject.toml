[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "socpuppet"
version = "0.0.1"
description = "A whole SoC simulated in SystemC, with Python pulling the strings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
authors = [{ name = "Chris Hurley" }]
keywords = ["systemc", "tlm", "virtual platform", "risc-v", "simulation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Emulators",
]

[project.urls]
Repository = "https://github.com/cphurley82/socpuppet"
Documentation = "https://github.com/cphurley82/socpuppet/tree/main/docs"
Issues = "https://github.com/cphurley82/socpuppet/issues"

[project.scripts]
socpuppet = "socpuppet.cli:main"

# pytest loads the plugin by itself wherever socpuppet is installed. The
# entry is named after the module so that a conftest.py which also names the
# module in `pytest_plugins` does not load it a second time.
[project.entry-points.pytest11]
"socpuppet.pytest_plugin" = "socpuppet.pytest_plugin"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "clang-format==23.1.2",
    "clang-tidy==22.1.8",
    "cmake>=3.28",
    "coverage>=7.10",
    "cpplint>=2.0.2",
    "gcovr>=8.6",
    "mypy>=1.18",
    "ninja>=1.11",
    "pytest>=9",
    "ruff>=0.16",
    "rumdl==0.2.78",
    "shellcheck-py>=0.11.0.1",
]

[tool.uv]
# The dev loop builds with CMake directly (see CMakePresets.json), so
# `uv sync` only installs tools and never builds the project itself.
package = false

[tool.scikit-build]
# This is the packaging path (`uv build`, `pip install .`). It builds the
# extension without the C++ tests and installs it into the wheel.
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
wheel.packages = ["python/socpuppet"]
# What a source distribution leaves behind: build trees, the write-ups,
# and experiments that nothing in the package depends on.
sdist.exclude = ["build", "dist", "docs", "spikes", "wheelhouse"]
# Keep the build tree between runs so SystemC and SCC are not rebuilt.
build-dir = "build/wheel-{wheel_tag}"

[tool.scikit-build.cmake.define]
SOCPUPPET_BUILD_TESTS = false

[tool.cibuildwheel]
# The portable wheels, one per Python version and platform: what
# `uv add socpuppet` will fetch once they are published. CI builds them
# (see .github/workflows/ci.yml). Each is installed into a fresh environment
# and tested there, away from the source tree.
build = ["cp312-*", "cp313-*", "cp314-*"]
# manylinux covers the glibc distributions. musl (Alpine) is not built yet.
skip = ["*-musllinux_*"]
test-sources = ["tests/python"]
test-requires = ["pytest"]
test-command = "pytest tests/python"

[tool.cibuildwheel.linux]
# SCC's trace writer needs zlib's headers. The library itself is part of
# the manylinux baseline, so the wheel may depend on it.
before-all = "dnf install -y zlib-devel"

[tool.cibuildwheel.macos]
# The oldest macOS the wheel runs on. C++20's std::format for floating-point
# numbers, which the code uses, arrived in the system's C++ library with 13.3.
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# The dev build drops the native extension into python/socpuppet/, so the
# package is importable straight from the source tree.
pythonpath = ["python"]
